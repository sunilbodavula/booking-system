services:
  postgres:
    image: postgres:16
    container_name: booking-db
    environment:
      POSTGRES_DB: booking_system
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_pgdata:/var/lib/postgresql/data

volumes:
  postgres_pgdata:
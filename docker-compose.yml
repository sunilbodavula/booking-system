services:
  postgres:
    image: postgres:16
    container_name: booking-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_pgdata:/var/lib/postgresql/data
  test-db:
    image: postgres:16-alpine
    container_name: booking-test-db
    environment:
      POSTGRES_DB: booking_system_test
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_test_password
    ports:
      - "5435:5432"

volumes:
  postgres_pgdata: